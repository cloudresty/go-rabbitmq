name: Auto Merge to Main

on:
  push:
    branches:
      - develop
  # The scheduled dependency and Go-version workflows push to develop with
  # GITHUB_TOKEN, which fires no push workflows, so they dispatch this one
  # (and CI) explicitly. Only a dispatch on develop proceeds.
  workflow_dispatch:

# Every credential in this workflow is the built-in GITHUB_TOKEN, scoped here.
# There is deliberately no PAT fallback. The old
# `CLOUDRESTY_GITBOT_PAT || GITHUB_TOKEN` expression silently switched
# credential whenever the PAT was unset, expired or not scoped to this
# repository; a GITHUB_TOKEN merge then fires no push workflows, so the
# release chain stopped without an error anywhere.
#   contents: write       merge develop into main
#   pull-requests: write  open / reuse the develop -> main PR
#   actions: write        dispatch Auto Release (see the merge step)
#
# Repository setting required: Actions > General > "Allow GitHub Actions to
# create and approve pull requests" (can_approve_pull_request_reviews).
permissions:
  contents: write
  pull-requests: write
  actions: write

# A merged PR into develop is also a push to develop, so the push trigger
# alone covers it; the old extra pull_request:closed trigger started a second,
# racing run for the same commit. Runs are serialised, never cancelled, so a
# newer develop push waits for the older merge to finish.
concurrency:
  group: auto-merge-to-main
  cancel-in-progress: false

env:
  GO_VERSION: '1.26'

jobs:
  # Only run for a push to develop, or a dispatch on develop
  check-trigger:
    name: Check Trigger Conditions
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.check.outputs.should_proceed }}
    steps:
      - name: Check if we should proceed
        id: check
        run: |
          SHOULD_PROCEED=false

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "Triggered by push to develop branch"
            SHOULD_PROCEED=true
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "Dispatched on develop"
            SHOULD_PROCEED=true
          fi

          echo "should_proceed=$SHOULD_PROCEED" >> $GITHUB_OUTPUT

  # Wait for CI workflow to complete before proceeding
  wait-for-ci:
    name: Wait for CI Completion
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_proceed == 'true'
    outputs:
      ci_success: ${{ steps.wait.outputs.ci_success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Wait for CI workflow
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for CI workflow to complete..."

          # Get the commit SHA for the current push
          COMMIT_SHA="${{ github.sha }}"
          echo "Checking CI status for commit: $COMMIT_SHA"

          # Wait for CI workflow to complete (max 20 minutes)
          TIMEOUT=1200  # 20 minutes
          ELAPSED=0
          INTERVAL=30   # Check every 30 seconds

          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "Checking CI workflow status... (${ELAPSED}s elapsed)"

            # Get workflow runs for this commit
            CI_STATUS=$(gh run list --workflow=ci.yaml --commit="$COMMIT_SHA" --json status,conclusion --limit 1)

            if [ "$(echo "$CI_STATUS" | jq length)" -eq 0 ]; then
              echo "No CI workflow found for this commit yet, waiting..."
            else
              STATUS=$(echo "$CI_STATUS" | jq -r '.[0].status')
              CONCLUSION=$(echo "$CI_STATUS" | jq -r '.[0].conclusion')

              echo "CI Status: $STATUS, Conclusion: $CONCLUSION"

              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then
                  echo "✅ CI workflow completed successfully"
                  echo "ci_success=true" >> $GITHUB_OUTPUT
                  exit 0
                else
                  echo "❌ CI workflow failed with conclusion: $CONCLUSION"
                  echo "ci_success=false" >> $GITHUB_OUTPUT
                  exit 1
                fi
              fi
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⏰ Timeout waiting for CI workflow"
          echo "ci_success=false" >> $GITHUB_OUTPUT
          exit 1

  # Run minimal additional tests (only what CI doesn't cover)
  test-develop:
    name: Additional Tests
    runs-on: ubuntu-latest
    needs: [check-trigger, wait-for-ci]
    if: needs.check-trigger.outputs.should_proceed == 'true' && needs.wait-for-ci.outputs.ci_success == 'true'
    outputs:
      tests_passed: ${{ steps.tests.outputs.tests_passed }}
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run additional checks
        id: tests
        run: |
          echo "Running additional checks not covered by CI..."

          # Check for any uncommitted changes
          echo "Checking for uncommitted changes..."
          if ! git diff --quiet; then
            echo "Uncommitted changes detected"
            git status
            echo "tests_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "No uncommitted changes"

          # Verify all workflows are valid
          echo "Validating GitHub Actions workflows..."
          for workflow in .github/workflows/*.yaml; do
            echo "Validating $workflow..."
            # Basic YAML syntax check
            if ! python3 -c "import yaml; yaml.safe_load(open('$workflow'))" 2>/dev/null; then
              echo "Invalid YAML syntax in $workflow"
              echo "tests_passed=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          done
          echo "All workflows are valid"

          echo "All additional checks passed!"
          echo "tests_passed=true" >> $GITHUB_OUTPUT

  # Merge develop to main if tests pass
  merge-to-main:
    name: Merge to Main
    runs-on: ubuntu-latest
    needs: [check-trigger, test-develop]
    if: needs.check-trigger.outputs.should_proceed == 'true' && needs.test-develop.outputs.tests_passed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if main is behind develop
        id: check_behind
        run: |
          git fetch origin main develop

          # Check if main is behind develop
          BEHIND_COUNT=$(git rev-list --count origin/main..origin/develop)
          echo "Main is $BEHIND_COUNT commits behind develop"

          if [ "$BEHIND_COUNT" -gt 0 ]; then
            echo "needs_merge=true" >> $GITHUB_OUTPUT
            echo "behind_count=$BEHIND_COUNT" >> $GITHUB_OUTPUT
          else
            echo "needs_merge=false" >> $GITHUB_OUTPUT
            echo "Main branch is up to date with develop"
          fi

      - name: Open and merge the develop -> main PR
        id: merge
        if: steps.check_behind.outputs.needs_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          DEVELOP_SHA=$(git rev-parse origin/develop)
          if [ "$DEVELOP_SHA" != "$TESTED_SHA" ]; then
            # Only ever merge the commit CI was waited on above. The run for
            # the newer push is queued behind this one and will merge it.
            echo "develop moved from $TESTED_SHA to $DEVELOP_SHA; leaving the merge to the newer run"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Mirror Auto Release's push path filter, so a docs-only change
          # still reaches main without cutting a release.
          if git diff --name-only origin/main origin/develop | grep -qE '(^go\.mod$|^go\.sum$|\.go$)'; then
            RELEASE_RELEVANT=true
          else
            RELEASE_RELEVANT=false
          fi
          echo "Release-relevant changes: $RELEASE_RELEVANT"

          gh label create "automation" --description "Automated process" --color "0e8a16" 2>/dev/null || true
          gh label create "auto-merge" --description "Automatic merge process" --color "1d76db" 2>/dev/null || true

          BEHIND_COUNT="${{ steps.check_behind.outputs.behind_count }}"
          TITLE=$(git log -1 --format=%s origin/develop)
          PR_BODY="## Auto-Merge: Develop to Main

          Merges $BEHIND_COUNT commit(s) from develop ($DEVELOP_SHA) to main.

          ### Commits
          $(git log --format='- %h %s' origin/main..origin/develop)

          CI passed on exactly this develop commit before this PR was opened.
          Release-relevant changes (go.mod, go.sum, *.go): $RELEASE_RELEVANT

          ---
          *Auto-generated by the Auto Merge to Main workflow*"

          PR_URL=$(gh pr list --base main --head develop --state open --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "Reusing open PR: $PR_URL"
            gh pr edit "$PR_URL" --title "$TITLE" --body "$PR_BODY" --add-label "automation,auto-merge"
          else
            PR_URL=$(gh pr create --base main --head develop --title "$TITLE" --body "$PR_BODY" --label "automation,auto-merge")
            echo "Created PR: $PR_URL"
          fi

          # Merge directly rather than with --auto: CI has already passed on
          # this exact commit, and main requires no status checks, so there
          # is nothing for --auto to wait for. Mergeability is
          # computed asynchronously right after creation, hence the retries.
          # --match-head-commit refuses to merge anything but the tested SHA.
          MERGED=false
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR_URL" --merge --match-head-commit "$DEVELOP_SHA"; then
              MERGED=true
              break
            fi
            echo "Merge attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          if [ "$MERGED" != "true" ]; then
            echo "Could not merge $PR_URL"
            exit 1
          fi

          MERGE_SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')
          echo "Merged $PR_URL as $MERGE_SHA"
          {
            echo "merged=true"
            echo "pr_url=$PR_URL"
            echo "merge_sha=$MERGE_SHA"
            echo "release_relevant=$RELEASE_RELEVANT"
          } >> "$GITHUB_OUTPUT"

      # A merge made with GITHUB_TOKEN deliberately triggers no push workflows,
      # so Auto Release's `push: main` trigger never fires for it. A
      # workflow_dispatch is the documented exception, so dispatch it here and
      # wait for it: if the release fails, this run fails too, instead of
      # reporting a release that never happened.
      - name: Dispatch Auto Release and wait for it
        id: release
        if: steps.merge.outputs.merged == 'true' && steps.merge.outputs.release_relevant == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo none)
          SINCE=$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run auto-release.yaml --ref main -f release_type=auto

          RUN_ID=""
          for _ in $(seq 1 24); do
            RUN_ID=$(gh run list --workflow auto-release.yaml --event workflow_dispatch --branch main \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$SINCE\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "The dispatched Auto Release run never appeared"
            exit 1
          fi

          echo "Watching Auto Release run $RUN_ID"
          gh run watch "$RUN_ID" --exit-status --interval 30
          TAG=$(gh release view --json tagName --jq '.tagName')
          echo "Latest release: $TAG"
          # Judge the release by its artefact, not the run's status: a green
          # Auto Release run that skipped its release jobs publishes nothing.
          if [ "$TAG" = "$BEFORE" ]; then
            echo "Auto Release run $RUN_ID succeeded but published no new release (still $TAG)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create summary
        if: steps.check_behind.outputs.needs_merge == 'true'
        run: |
          {
            echo "## Auto-Merge Summary"
            echo ""
            if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
              echo "**Merged**: ${{ steps.merge.outputs.pr_url }} (${{ steps.merge.outputs.merge_sha }})"
              echo "**Commits merged**: ${{ steps.check_behind.outputs.behind_count }}"
              if [ "${{ steps.merge.outputs.release_relevant }}" = "true" ]; then
                echo "**Release**: ${{ steps.release.outputs.tag }}"
              else
                echo "**Release**: none (no go.mod, go.sum or .go changes)"
              fi
            else
              echo "**Status**: develop moved during this run; the newer run merges it"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Skip merge if not needed
        if: steps.check_behind.outputs.needs_merge == 'false'
        run: |
          echo "## Auto-Merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: No merge needed" >> $GITHUB_STEP_SUMMARY
          echo "**Reason**: Main branch is already up to date with develop" >> $GITHUB_STEP_SUMMARY

  # Notify about merge results
  notify-merge:
    name: Notify Merge Results
    runs-on: ubuntu-latest
    needs: [test-develop, merge-to-main]
    if: needs.test-develop.outputs.tests_passed == 'true' && needs.merge-to-main.result == 'success'
    steps:
      - name: Notify success
        if: needs.merge-to-main.result == 'success'
        run: |
          echo "Auto-merge workflow completed successfully"
          echo "Develop branch tests passed"
          echo "Changes merged to main branch"
          echo "Ready for auto-release"

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != '' && needs.merge-to-main.result == 'success'
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "go-rabbitmq: Auto-merge PR created",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*go-rabbitmq Auto-merge PR Created*\n\n• All tests passed on develop\n• PR created from develop to main\n• Auto-merge enabled for automatic merging\n• Ready for automatic release\n\n<https://github.com/cloudresty/go-rabbitmq/pulls|View Pull Requests>"
                  }
                }
              ]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Handle test failures
  notify-failure:
    name: Notify Test Failures
    runs-on: ubuntu-latest
    needs: [test-develop]
    if: always() && needs.test-develop.outputs.tests_passed == 'false'
    steps:
      - name: Notify failure
        run: |
          echo "Auto-merge workflow failed"
          echo "Tests failed on develop branch"
          echo "Merge to main blocked"

      - name: Send failure notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "go-rabbitmq: Auto-merge failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*go-rabbitmq Auto-merge Failed*\n\n• Tests failed on develop branch\n• Merge to main blocked\n• Manual intervention required\n\n<https://github.com/cloudresty/go-rabbitmq/actions|View Actions>"
                  }
                }
              ]
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
