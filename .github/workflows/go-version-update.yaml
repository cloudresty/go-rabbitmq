name: Go Version Update Check

on:
  schedule:
    # Check for new Go versions every Tuesday at 3 AM UTC
    - cron: '0 3 * * 2'
  workflow_dispatch:

# GITHUB_TOKEN only, no PAT fallback: a missing or expired PAT must fail
# loudly instead of silently degrading to a different credential.
#   contents: write       push the proposal branch
#   pull-requests: write  open the proposal PR into develop
#   actions: write        dispatch CI on the proposal branch
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  check-go-version:
    runs-on: ubuntu-latest
    outputs:
      has_new_version: ${{ steps.check.outputs.has_new_version }}
      current_version: ${{ steps.check.outputs.current_version }}
      latest_version: ${{ steps.check.outputs.latest_version }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Check Go versions
        id: check
        run: |
          CURRENT_GO_VERSION=$(grep "^go " go.mod | awk '{print $2}')
          echo "Current Go version in go.mod: $CURRENT_GO_VERSION"

          # go.dev is the authoritative list. golang/go publishes no GitHub
          # releases, so the old query of its releases API always returned
          # "null" and this check silently never found anything.
          LATEST_GO_VERSION=$(curl -fsSL 'https://go.dev/dl/?mode=json' | \
            jq -r '[.[] | select(.stable)] | .[0].version' | sed 's/^go//')
          if ! echo "$LATEST_GO_VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Could not determine the latest Go version (got '$LATEST_GO_VERSION')"
            exit 1
          fi
          echo "Latest Go version: $LATEST_GO_VERSION"

          HAS_NEW_VERSION=false
          if [ "$CURRENT_GO_VERSION" != "$LATEST_GO_VERSION" ] && \
             [ "$(printf '%s\n%s' "$CURRENT_GO_VERSION" "$LATEST_GO_VERSION" | sort -V | head -1)" = "$CURRENT_GO_VERSION" ]; then
            HAS_NEW_VERSION=true
          fi
          echo "New Go version available: $HAS_NEW_VERSION"

          echo "has_new_version=$HAS_NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_GO_VERSION" >> $GITHUB_OUTPUT
          echo "latest_version=$LATEST_GO_VERSION" >> $GITHUB_OUTPUT

  propose-go-version:
    needs: check-go-version
    if: needs.check-go-version.outputs.has_new_version == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.check-go-version.outputs.latest_version }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Only go.mod's go directive is changed. Workflow files are left alone:
      # GITHUB_TOKEN can never push a change under .github/workflows. The
      # directive is the minimum Go version for every consumer of this
      # module, so it is proposed as a PR for a person to decide, never
      # pushed straight to develop.
      - name: Update go directive and run quick tests
        env:
          NEW_VERSION: ${{ needs.check-go-version.outputs.latest_version }}
        run: |
          go mod edit -go="$NEW_VERSION"
          go mod tidy
          go mod verify
          go test -short ./...

      - name: Open a PR into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ needs.check-go-version.outputs.current_version }}
          NEW_VERSION: ${{ needs.check-go-version.outputs.latest_version }}
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "No changes to propose"
            exit 0
          fi

          BRANCH="auto-go-version-$NEW_VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "A proposal for Go $NEW_VERSION already exists on $BRANCH"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add go.mod go.sum
          git commit -m "chore: update Go version to $NEW_VERSION" \
            -m "Raises the go directive from $CURRENT_VERSION to $NEW_VERSION. Auto-generated by the Go version update workflow."
          git push origin "$BRANCH"

          gh label create "automated" --description "Automated process" --color "0e8a16" 2>/dev/null || true
          PR_BODY="Raises the \`go\` directive in go.mod from $CURRENT_VERSION to $NEW_VERSION.

          This is the minimum Go version every consumer of this module must use, so it needs a person's decision: merge to adopt it, close to stay on $CURRENT_VERSION. Merging releases through the usual Auto Merge to Main path.

          ---
          *Auto-generated by the Go version update workflow*"
          PR_URL=$(gh pr create --base develop --head "$BRANCH" \
            --title "chore: update Go version to $NEW_VERSION" \
            --label "automated" --body "$PR_BODY")
          echo "Opened $PR_URL"

          # A PR opened with GITHUB_TOKEN fires no pull_request workflows, so
          # run CI on the branch; its checks attach to the PR's head commit.
          gh workflow run ci.yaml --ref "$BRANCH"
